[project]
name = "gerry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "openai-agents[litellm]>=0.24.0",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls real model or news services; run only with -m live",
]
addopts = "-m 'not live'"
